# nginx-Konfiguration für das Glücksrad (statische Seite).
# Wird im Dockerfile nach /etc/nginx/conf.d/default.conf kopiert.
# HTTPS übernimmt der Proxy von Coolify (Traefik/Caddy) – hier reicht HTTP auf Port 3100.
# (Ein hoher Port statt 80 vermeidet jede Verwechslung mit dem Port 80 des Proxys.)

# ---------- Datenschutzfreundliche Logs ----------
# IP-Adressen werden gekürzt gespeichert: 203.0.113.42 → 203.0.113.0, bei IPv6 nur die ersten
# drei Blöcke. Die echte Besucher-IP steht hinter dem Proxy in X-Forwarded-For.
map $http_x_forwarded_for $anonym_client {
    ~^(?<ip4>\d+\.\d+\.\d+)\.\d+                              $ip4.0;
    "~^(?<ip6>[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4})"  $ip6::;
    default                                                         -;
}
map $remote_addr $anonym_remote {
    ~^(?<ip4>\d+\.\d+\.\d+)\.\d+                              $ip4.0;
    "~^(?<ip6>[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4})"  $ip6::;
    default                                                         -;
}
# Ohne Referrer und ohne volle IP
log_format anonym '$anonym_remote [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" "$anonym_client"';

# ---------- Öffentliche Adresse der Seite ----------
# Für Link-Vorschauen (WhatsApp, Teams …) brauchen og:image & Co. absolute URLs.
# Der Platzhalter %BASIS_URL% im HTML wird unten per sub_filter ersetzt.
# Nur erwartbare Werte zulassen – der Host-Header kommt vom Client.
map $http_x_forwarded_proto $basis_schema {
    https    https;
    http     http;
    default  $scheme;
}
map $http_host $basis_host {
    ~*^[a-z0-9.-]+(:[0-9]+)?$  $http_host;
    default                    localhost;
}

server {
    # Nur IPv4: Der Proxy von Coolify spricht den Container über das interne Docker-Netz an.
    # (Ein "listen [::]:…" würde nginx abstürzen lassen, wenn im Container kein IPv6 verfügbar ist.)
    listen 3100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/access.log anonym;

    sub_filter_once off;
    sub_filter '%BASIS_URL%' '$basis_schema://$basis_host';

    # Komprimierung für Textdateien
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Die Dateinamen haben keine Versionsnummern. "no-cache" heißt: der Browser darf
    # zwischenspeichern, fragt aber jedes Mal kurz nach (304), ob es etwas Neues gibt.
    # So ist nach einem Deployment sofort die neue Version da.
    add_header Cache-Control "no-cache" always;

    # Sicherheits-Header
    # (Hinweis: add_header in einem location-Block würde diese hier ersetzen – deshalb stehen alle hier oben.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Für den Health-Check von Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # App-Manifest (die Endung .webmanifest kennt nicht jede nginx-Version)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Icons, die Browser und iOS von sich aus unter festen Adressen suchen
    location = /favicon.ico {
        access_log off;
        try_files /icons/icon-192.png =404;
    }
    location ~ ^/apple-touch-icon(-precomposed)?\.png$ {
        access_log off;
        try_files /icons/apple-touch-icon.png =404;
    }

    # Versteckte Dateien (.git, .env …) nie ausliefern
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
